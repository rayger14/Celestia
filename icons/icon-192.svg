<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d35"/>
      <stop offset="100%" stop-color="#030014"/>
    </radialGradient>
    <radialGradient id="sun" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="50%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,200,50,0.35)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6ab4ff"/>
      <stop offset="60%" stop-color="#4f8fff"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </radialGradient>
    <radialGradient id="mars" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0a070"/>
      <stop offset="100%" stop-color="#802010"/>
    </radialGradient>
    <radialGradient id="jupiter" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#6a4520"/>
    </radialGradient>
    <radialGradient id="saturn" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0a0"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </radialGradient>
    <radialGradient id="venus" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0ddb0"/>
      <stop offset="100%" stop-color="#8a7040"/>
    </radialGradient>
    <radialGradient id="mercury" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#555"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)" rx="32"/>

  <!-- Stars -->
  <circle cx="25" cy="30" r="0.8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="160" cy="20" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="40" cy="150" r="0.6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="170" cy="140" r="0.8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="15" cy="90" r="0.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="180" cy="80" r="0.7" fill="rgba(255,255,255,0.4)"/>
  <circle cx="70" cy="170" r="0.6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="130" cy="15" r="0.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="50" cy="25" r="0.4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="145" cy="170" r="0.7" fill="rgba(255,255,255,0.4)"/>

  <!-- Zodiac ring -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="rgba(139,92,246,0.08)" stroke-width="2.5"/>

  <!-- Orbits -->
  <circle cx="96" cy="96" r="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <circle cx="96" cy="96" r="32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <circle cx="96" cy="96" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <circle cx="96" cy="96" r="56" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <circle cx="96" cy="96" r="68" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>
  <circle cx="96" cy="96" r="78" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"/>

  <!-- Sun glow -->
  <circle cx="96" cy="96" r="22" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="96" cy="96" r="8" fill="url(#sun)"/>

  <!-- Mercury -->
  <circle cx="111" cy="82" r="2" fill="url(#mercury)"/>
  <!-- Venus -->
  <circle cx="72" cy="112" r="3" fill="url(#venus)"/>
  <!-- Earth -->
  <circle cx="127" cy="118" r="3.5" fill="url(#earth)"/>
  <!-- Mars -->
  <circle cx="56" cy="64" r="2.8" fill="url(#mars)"/>
  <!-- Jupiter -->
  <circle cx="40" cy="110" r="5.5" fill="url(#jupiter)"/>
  <!-- Saturn -->
  <ellipse cx="155" cy="55" rx="4.5" ry="4.5" fill="url(#saturn)"/>
  <!-- Saturn ring -->
  <ellipse cx="155" cy="55" rx="8" ry="2.5" fill="none" stroke="rgba(232,208,136,0.45)" stroke-width="0.8"/>
</svg>
